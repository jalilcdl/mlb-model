name: Poll live signals

# Lives at repo root (.github/workflows/) as required for GitHub's cron
# scheduler to discover it, but everything it runs lives under
# live-betting-app/ -- see live-betting-app/README.md for the full picture.
# This workflow is independent of the MLB dashboard's own deploy; it only
# touches files under live-betting-app/.

on:
  schedule:
    # EXPERIMENTAL/UNRELIABLE: confirmed via real run timestamps to land
    # 150-250+ minutes apart in practice, not every 5 minutes -- GitHub's
    # schedule trigger is a documented best-effort, low-priority queue with
    # no timing guarantee, worse on lower-activity repos. Kept only as a
    # slow backstop while repository_dispatch (below) is being verified as
    # the real fix; not something to rely on alone.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab
  repository_dispatch:
    types: [poll_test]   # TEMPORARY event name while empirically verifying
                         # dispatch-triggered timing -- see investigation log

permissions:
  contents: write   # the poller commits new data/ files back to this repo

concurrency:
  group: poll-live-signals
  cancel-in-progress: false   # never kill a run mid-poll; just let the next tick queue

jobs:
  poll:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: live-betting-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: live-betting-app/requirements-poller.txt

      - name: Install poller dependencies
        run: pip install -r requirements-poller.txt

      - name: Run one poll cycle (OBSERVE-ONLY)
        env:
          SHARPAPI_API_KEY: ${{ secrets.SHARPAPI_API_KEY }}
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m core.poller

      - name: Commit new data (if any)
        run: |
          git config user.name "live-signal-poller"
          git config user.email "actions@users.noreply.github.com"
          # `git add` on an exact path fails hard ("did not match any files")
          # if that file doesn't exist yet -- true on every run until the
          # first live game ever logs a row. Scope to the whole data/
          # directory instead so this never depends on which files exist.
          git add -A -- data/
          git diff --cached --quiet || git commit -m "poller: log update $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
