name: Poll live signals

# Lives at repo root (.github/workflows/) as required for GitHub's cron
# scheduler to discover it, but everything it runs lives under
# live-betting-app/ -- see live-betting-app/README.md for the full picture.
# This workflow is independent of the MLB dashboard's own deploy; it only
# touches files under live-betting-app/.

on:
  schedule:
    # Every 5 minutes -- GitHub's minimum cron granularity. Actual timing can
    # slip a few minutes under GitHub's scheduling load; that's a known
    # limitation of the free-tier cron approach, not a bug.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write   # the poller commits new data/ files back to this repo

concurrency:
  group: poll-live-signals
  cancel-in-progress: false   # never kill a run mid-poll; just let the next tick queue

jobs:
  poll:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: live-betting-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: live-betting-app/requirements-poller.txt

      - name: Install poller dependencies
        run: pip install -r requirements-poller.txt

      - name: Run one poll cycle (OBSERVE-ONLY)
        env:
          SHARPAPI_API_KEY: ${{ secrets.SHARPAPI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m core.poller

      - name: Commit new data (if any)
        run: |
          git config user.name "live-signal-poller"
          git config user.email "actions@users.noreply.github.com"
          git add data/live_signal_log.jsonl data/notified_state.json
          git diff --cached --quiet || git commit -m "poller: log update $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
